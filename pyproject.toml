[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "j1939-emulator"
version = "1.0.0"
description = "SAE J1939 heavy-duty vehicle ECU emulator (python-can + can-j1939)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-can[gs-usb,serial]>=4.3",
  "can-j1939>=2.0",
  "nicegui>=2.0",
  "cantools>=39.0",
  "libusb-package>=1.0",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Optional local tooling (tests/ is gitignored — for maintainers only)
dev = ["pytest>=8.0"]

[project.scripts]
j1939-emulator = "j1939_emulator.cli:main"

[tool.setuptools.packages.find]
include = ["j1939_emulator*"]
